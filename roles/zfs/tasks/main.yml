---
# zfs-dkms/zfsutils-linux live in Debian contrib. Enable it in whichever
# apt sources format the host uses: classic one-line sources.list AND the
# Debian 12+/trixie deb822 .sources file. Both edits are idempotent.
- name: Stat classic apt sources.list
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: zfs_classic_sources

- name: Enable contrib in classic apt sources.list
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^(deb(?:-src)?\s+http://deb\.debian\.org/debian/\s+\S+\s+main(?!.*\bcontrib\b))(.*)'
    replace: '\1 contrib\2'
  when: zfs_classic_sources.stat.exists

- name: Stat deb822 Debian sources file
  ansible.builtin.stat:
    path: "{{ zfs_deb822_sources_file }}"
  register: zfs_deb822_sources

- name: Enable contrib in deb822 Debian sources (trixie+)
  ansible.builtin.replace:
    path: "{{ zfs_deb822_sources_file }}"
    regexp: '^(Components:(?!.*\bcontrib\b).*\bmain\b.*)$'
    replace: '\1 contrib'
  when: zfs_deb822_sources.stat.exists

- name: Install ZFS packages
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - zfsutils-linux
    state: present
    update_cache: true

- name: Load ZFS kernel module
  community.general.modprobe:
    name: zfs
    state: present

- name: Configure ZFS ARC max size
  ansible.builtin.copy:
    content: "options zfs zfs_arc_max={{ zfs_arc_max_gb * 1073741824 }}\n"
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload zfs module params

- name: Check if ZFS pool already exists
  ansible.builtin.command:
    cmd: zpool list {{ zfs_pool_name }}
  register: zpool_check
  changed_when: false
  failed_when: false
  check_mode: false  # probe must run under --check or every `when` below errors

# Rebuild-onto-existing-disks path: labelled disks + no imported pool means
# the pool exists but is not imported (fresh OS, controller swap). Import it
# (-N: no mount; keys are loaded and datasets mounted at the end of the role).
- name: Probe configured disks for existing ZFS labels
  ansible.builtin.shell:
    cmd: blkid -o value -s TYPE {{ item }} {{ item }}-part1 2>/dev/null || true
  register: zfs_disk_blkid
  loop: "{{ zfs_disks }}"
  changed_when: false
  check_mode: false
  when: zpool_check.rc != 0

- name: Import existing pool from labelled disks
  ansible.builtin.command:
    cmd: zpool import -d /dev/disk/by-id -N {{ zfs_pool_name }}
  register: zfs_pool_imported_now
  changed_when: true
  when:
    - zpool_check.rc != 0
    - zfs_import_existing
    - zfs_disk_blkid.results | default([]) | map(attribute='stdout', default='') | select('search', 'zfs_member') | list | length > 0

- name: Re-check pool after import
  ansible.builtin.command:
    cmd: zpool list {{ zfs_pool_name }}
  register: zfs_pool_recheck
  changed_when: false
  failed_when: false
  check_mode: false
  when: zfs_pool_imported_now is changed

# Only overwrite the probe when a re-check actually ran (a skipped task result
# carries no rc and would break every `zpool_check.rc` conditional below).
- name: Adopt the post-import pool state
  ansible.builtin.set_fact:
    zpool_check: "{{ zfs_pool_recheck }}"
  when: zfs_pool_recheck is not skipped

# Not-imported is indistinguishable from never-existed to `zpool list`. Refuse
# to create unless explicitly allowed; the recovery for an existing pool is an
# import, never a create.
- name: Refuse to create a pool unless explicitly allowed
  ansible.builtin.fail:
    msg: >-
      ZFS pool '{{ zfs_pool_name }}' is not imported and zfs_allow_pool_create
      is false. If the pool exists, import it:
      `zpool import -d /dev/disk/by-id {{ zfs_pool_name }}` then re-run.
      Only for a genuinely new host set zfs_allow_pool_create=true.
  when:
    - zpool_check.rc != 0
    - not zfs_allow_pool_create

- name: Validate ZFS disk configuration
  vars:
    zfs_min_disks:
      stripe: 1
      mirror: 2
      raidz: 3
      raidz1: 3
      raidz2: 4
      raidz3: 5
    zfs_required_min: "{{ zfs_min_disks[zfs_pool_type] | default(2) }}"
  ansible.builtin.assert:
    that:
      - zfs_pool_type in zfs_min_disks
      - zfs_disks | length >= (zfs_required_min | int)
    fail_msg: >-
      zfs_pool_type={{ zfs_pool_type }} requires at least
      {{ zfs_required_min }} disk(s); got {{ zfs_disks | length }}.
  when: zpool_check.rc != 0

- name: Verify disk paths exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: disk_check
  loop: "{{ zfs_disks }}"
  when: zpool_check.rc != 0

- name: Fail if any disk path is missing
  ansible.builtin.fail:
    msg: "Disk not found: {{ item.item }}"
  loop: "{{ disk_check.results | default([]) }}"
  when:
    - zpool_check.rc != 0
    - not item.stat.exists

# Second layer behind ZFS's own "is part of exported pool" refusal: labelled
# disks that did not import must never be created over.
- name: Refuse to create over disks that already carry ZFS labels
  ansible.builtin.fail:
    msg: "{{ item.item }} already holds a ZFS label (zfs_member); import it, do not create."
  loop: "{{ zfs_disk_blkid.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default(item) }}"
  when:
    - zpool_check.rc != 0
    - "'zfs_member' in (item.stdout | default(''))"

# Pool-level encryption keyfile must exist before `zpool create` reads it.
# Done in the same `when: zpool_check.rc != 0` band as pool creation so it
# only runs when we're actually about to create the pool.
- name: Ensure /etc/zfs-keys directory for pool encryption
  ansible.builtin.file:
    path: /etc/zfs-keys
    owner: root
    group: root
    mode: "0700"
    state: directory
  when:
    - zpool_check.rc != 0
    - zfs_pool_encryption is defined

- name: Drop ZFS pool encryption key
  ansible.builtin.copy:
    content: "{{ zfs_pool_encryption.key_content }}"
    dest: "{{ zfs_pool_encryption.keylocation | regex_replace('^file://', '') }}"
    owner: root
    group: root
    mode: "0400"
  when:
    - zpool_check.rc != 0
    - zfs_pool_encryption is defined
    - zfs_pool_encryption.key_content | default('') | length > 0
  no_log: true

# When zfs_pool_encryption is defined, append -O flags to set encryption
# at pool creation. Children of `tank` then inherit encryption automatically,
# so any dataset later created by zfs_datasets OR by syncoid's `zfs receive`
# is encrypted without per-dataset config.
- name: Create ZFS pool
  ansible.builtin.command:
    cmd: >
      zpool create
      -o ashift=12
      {% if zfs_pool_encryption is defined %}
      -O encryption={{ zfs_pool_encryption.cipher }}
      -O keyformat={{ zfs_pool_encryption.keyformat }}
      -O keylocation={{ zfs_pool_encryption.keylocation }}
      {% endif %}
      {{ zfs_pool_name }} {{ zfs_pool_type }}
      {{ zfs_disks | join(' ') }}
  when: zpool_check.rc != 0

- name: Set pool properties
  community.general.zfs:
    name: "{{ zfs_pool_name }}"
    state: present
    extra_zfs_properties:
      compression: lz4
      atime: "off"
      xattr: sa
      acltype: posixacl

# Datasets that declare an `encryption` block need their keyfile
# present on disk BEFORE the dataset is created (zfs create reads it
# at creation; encryption properties can't be added later).
- name: Ensure /etc/zfs-keys directory for encrypted datasets
  ansible.builtin.file:
    path: /etc/zfs-keys
    owner: root
    group: root
    mode: "0700"
    state: directory
  when: zfs_datasets | selectattr('encryption', 'defined') | list | length > 0

- name: Drop ZFS dataset encryption keys
  ansible.builtin.copy:
    content: "{{ item.encryption.key_content }}"
    dest: "{{ item.encryption.keylocation | regex_replace('^file://', '') }}"
    owner: root
    group: root
    mode: "0400"
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.encryption is defined
    - item.encryption.key_content | default('') | length > 0
  no_log: true

- name: List existing ZFS datasets
  ansible.builtin.command:
    cmd: zfs list -H -o name
  register: zfs_existing_datasets
  changed_when: false
  check_mode: false  # read-only; skipping it makes --check report every dataset as new

# Loop over a copy with key_content stripped: loop items are echoed on ok/
# changed lines and dumped in full when an item fails (e.g. a quota shrink
# below used space), so the raw list would print the dataset key into logs.
- name: Build key-free dataset list for the create loop
  ansible.builtin.set_fact:
    _zfs_datasets_safe: >-
      {{ (_zfs_datasets_safe | default([])) + [
           (item | combine({'encryption': (item.encryption | dict2items
                                            | rejectattr('key', 'equalto', 'key_content')
                                            | items2dict)}))
           if item.encryption is defined else item
         ] }}
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create ZFS datasets
  community.general.zfs:
    name: "{{ zfs_pool_name }}/{{ item.name }}"
    state: present
    # Static props are quota/compression/recordsize. If the dataset
    # declares an encryption block (cipher/keyformat/keylocation), it
    # gets merged in ONLY at creation time: encryption props are
    # creation-only in ZFS, and attempting `zfs set encryption=...` on a
    # pre-existing (e.g. not-yet-migrated, unencrypted) dataset fails.
    # Skipping the merge for existing datasets keeps the role idempotent
    # whether a declared-encrypted dataset has been migrated yet or not.
    extra_zfs_properties: >-
      {{
        {'quota': item.quota, 'compression': item.compression, 'recordsize': item.recordsize}
        | combine(
            {
              'encryption': item.encryption.cipher,
              'keyformat': item.encryption.keyformat,
              'keylocation': item.encryption.keylocation,
            } if (item.encryption is defined
                  and (zfs_pool_name ~ '/' ~ item.name) not in zfs_existing_datasets.stdout_lines)
            else {}
          )
      }}
  loop: "{{ _zfs_datasets_safe | default([]) }}"
  loop_control:
    label: "{{ zfs_pool_name }}/{{ item.name }}"

- name: Create ZFS scrub service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=ZFS scrub for %i

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/zpool scrub %i
    dest: /etc/systemd/system/zfs-scrub-monthly@.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Create monthly scrub timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Monthly ZFS scrub for {{ zfs_pool_name }}

      [Timer]
      OnCalendar=monthly
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/zfs-scrub-monthly@.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable monthly ZFS scrub timer
  ansible.builtin.systemd:
    name: zfs-scrub-monthly@{{ zfs_pool_name }}.timer
    enabled: true
    state: started
    daemon_reload: true

# ZFS vdev-error + scrub health metrics for the node_exporter textfile
# collector (see defaults/main.yml). Closes the gap that pdf/zfs_exporter
# leaves uncovered. node_exporter must have --collector.textfile.directory
# pointed at zfs_health_metrics_dir (the node_exporter role does this by
# default at the same path).
- name: Install jq (ZFS health metrics dependency)
  ansible.builtin.apt:
    name: jq
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: zfs_health_metrics_enabled

- name: Ensure node_exporter textfile collector directory exists
  ansible.builtin.file:
    path: "{{ zfs_health_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: zfs_health_metrics_enabled

- name: Install ZFS health-metrics collector script
  ansible.builtin.copy:
    src: zfs-health-metrics.sh
    dest: /usr/local/bin/zfs-health-metrics.sh
    owner: root
    group: root
    mode: "0755"
  when: zfs_health_metrics_enabled

- name: Install ZFS health-metrics service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Export ZFS vdev/scrub health metrics for node_exporter
      After=zfs-import.target
      Wants=zfs-import.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/zfs-health-metrics.sh {{ zfs_health_metrics_dir }}
    dest: /etc/systemd/system/zfs-health-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  when: zfs_health_metrics_enabled

- name: Install ZFS health-metrics timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Periodic ZFS vdev/scrub health metrics export

      [Timer]
      OnBootSec=3min
      OnUnitActiveSec={{ zfs_health_metrics_interval }}
      AccuracySec=30s

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/zfs-health-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  when: zfs_health_metrics_enabled

- name: Enable ZFS health-metrics timer
  ansible.builtin.systemd:
    name: zfs-health-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  when: zfs_health_metrics_enabled

# Populate metrics immediately so they don't wait for the first timer tick.
- name: Generate ZFS health metrics now
  ansible.builtin.command:
    cmd: /usr/local/bin/zfs-health-metrics.sh {{ zfs_health_metrics_dir }}
  changed_when: false
  when: zfs_health_metrics_enabled

- name: Enable ZFS import services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - zfs-import-cache.service
    - zfs-mount.service
    - zfs-import.target

# Debian's zfsutils-linux ships zfs-load-key.service masked (symlinked to
# /dev/null at the package level), so file:// keys are NOT loaded at boot
# and encrypted datasets stay locked/unmounted. Ship a real unit in /etc
# (which takes precedence over the package mask) that loads keys before
# zfs-mount.service runs. Discovered via Hercules reboot test 2026-06-12 —
# without this, every reboot needs a manual `zfs load-key -a`.
# The helper loads file:// keys only: `load-key -a` exits 255 on datasets
# whose keys are absent by design (raw-received blind replicas), leaving a
# red FAILED unit every boot on syncoid destinations like rdu-nas.
- name: Install zfs-load-file-keys helper
  ansible.builtin.copy:
    src: zfs-load-file-keys.sh
    dest: /usr/local/sbin/zfs-load-file-keys.sh
    owner: root
    group: root
    mode: "0755"
  when: >-
    zfs_pool_encryption is defined
    or (zfs_datasets | selectattr('encryption', 'defined') | list | length > 0)

- name: Install zfs-load-key boot unit (encrypted datasets/pool)
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Load ZFS encryption keys (file:// keylocations)
      DefaultDependencies=no
      After=zfs-import.target systemd-remount-fs.service
      Before=zfs-mount.service
      Wants=zfs-import.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/zfs-load-file-keys.sh

      [Install]
      WantedBy=zfs-mount.service
    dest: /etc/systemd/system/zfs-load-key.service
    owner: root
    group: root
    mode: "0644"
  when: >-
    zfs_pool_encryption is defined
    or (zfs_datasets | selectattr('encryption', 'defined') | list | length > 0)
  notify: reload systemd

- name: Enable zfs-load-key boot unit
  ansible.builtin.systemd:
    name: zfs-load-key.service
    enabled: true
    daemon_reload: true
  when: >-
    zfs_pool_encryption is defined
    or (zfs_datasets | selectattr('encryption', 'defined') | list | length > 0)

# After an in-role import (-N) bring the datasets up the same way boot does.
- name: Load file:// keys after in-role import
  ansible.builtin.command:
    cmd: /usr/local/sbin/zfs-load-file-keys.sh
  changed_when: true
  when:
    - zfs_pool_imported_now is changed
    - zfs_pool_encryption is defined or (zfs_datasets | selectattr('encryption', 'defined') | list | length > 0)

- name: Mount all datasets after in-role import
  ansible.builtin.command:
    cmd: zfs mount -a
  changed_when: true
  when: zfs_pool_imported_now is changed
