---
base_packages:
  - smartmontools
  - lm-sensors
  - htop
  - iotop-c
  - sysstat
  - tmux
  - sudo
  - openresolv

# UEFI hosts: also install the loader at the removable-media path
# (\EFI\BOOT\BOOTX64.EFI) so a firmware NVRAM reset (dead CMOS cell, ROM
# defaults) still boots unattended. Lesson from hercules 2026-09-12.
base_efi_removable_fallback: true
