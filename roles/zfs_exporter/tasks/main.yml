---
# Thin wrapper: delegates to the internal github_release_exporter role.
# Public var names/defaults (zfs_exporter_*) are preserved for back-compat.
- name: Install zfs_exporter via github_release_exporter
  ansible.builtin.include_role:
    name: reenchree.common.github_release_exporter
  vars:
    github_release_exporter_org: pdf
    github_release_exporter_repo: zfs_exporter
    github_release_exporter_version: "{{ zfs_exporter_version }}"
    github_release_exporter_listen_address: "{{ zfs_exporter_listen_address }}"
    github_release_exporter_extra_args: "{{ zfs_exporter_extra_args }}"
    github_release_exporter_unit_name: zfs_exporter
    github_release_exporter_description: ZFS Exporter
    github_release_exporter_after: network-online.target zfs.target
