---
# Thin wrapper: delegates to the internal github_release_exporter role.
# Public var names/defaults (smartctl_exporter_*) are preserved for back-compat.
- name: Install smartctl_exporter via github_release_exporter
  ansible.builtin.include_role:
    name: reenchree.common.github_release_exporter
  vars:
    github_release_exporter_org: prometheus-community
    github_release_exporter_repo: smartctl_exporter
    github_release_exporter_version: "{{ smartctl_exporter_version }}"
    github_release_exporter_listen_address: "{{ smartctl_exporter_listen_address }}"
    github_release_exporter_extra_args: "--smartctl.interval={{ smartctl_exporter_smartctl_interval }} --smartctl.path=/usr/sbin/smartctl"
    github_release_exporter_unit_name: smartctl_exporter
    github_release_exporter_description: Smartctl Exporter
    github_release_exporter_after: network-online.target
