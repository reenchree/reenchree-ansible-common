---
- name: reload udev
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true
  listen: reload udev

- name: trigger udev
  ansible.builtin.command: udevadm trigger --subsystem-match=usb
  changed_when: true
  listen: reload udev

- name: restart nut-driver-enumerator
  ansible.builtin.systemd:
    name: nut-driver-enumerator
    state: restarted
    daemon_reload: true

# Full restart, not SIGHUP: ignorelb/override.* are skipped on driver reload (NUT #3377)
- name: restart nut-driver instances
  ansible.builtin.systemd:
    name: "nut-driver@{{ item.name }}.service"
    state: restarted
  loop: "{{ nut_server_upses }}"
  loop_control:
    label: "{{ item.name }}"

- name: restart nut-server
  ansible.builtin.systemd:
    name: nut-server
    state: restarted
    daemon_reload: true

- name: restart nut-monitor
  ansible.builtin.systemd:
    name: nut-monitor
    state: restarted
    daemon_reload: true
